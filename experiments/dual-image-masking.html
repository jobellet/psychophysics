<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dual Image Masking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/jspsych@8.0.0/css/jspsych.css" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --page-bg: radial-gradient(circle at top, #0f172a 0%, #020617 100%);
        --panel-bg: rgba(15, 23, 42, 0.82);
        --panel-border: 1px solid rgba(148, 163, 184, 0.28);
        --accent: #60a5fa;
        --text-primary: #e2e8f0;
        --text-secondary: rgba(203, 213, 225, 0.88);
        --layout-padding: clamp(16px, 4vw, 48px);
        --card-width: min(960px, 100vw - (var(--layout-padding) * 2));
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(18px, 4vw, 32px);
        padding: var(--layout-padding);
        background: var(--page-bg);
        color: var(--text-primary);
      }

      .card {
        width: var(--card-width);
        border: var(--panel-border);
        border-radius: clamp(18px, 3vw, 28px);
        background: var(--panel-bg);
        padding: clamp(20px, 4vw, 36px);
        box-shadow: 0 22px 50px rgba(2, 6, 23, 0.5);
        display: flex;
        flex-direction: column;
        gap: clamp(14px, 3vw, 24px);
      }

      .card h1 {
        margin: 0;
        font-size: clamp(1.6rem, 4vw, 2.2rem);
      }

      .card p {
        margin: 0;
        color: var(--text-secondary);
        line-height: 1.55;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }

      button {
        appearance: none;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(30, 41, 59, 0.65);
        color: inherit;
        font: inherit;
        padding: 10px 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 160ms ease, transform 160ms ease, border-color 160ms ease;
      }

      button.primary {
        background: linear-gradient(135deg, #38bdf8, #2563eb);
        color: #f8fafc;
        border: none;
        box-shadow: inset 0 -2px 0 rgba(8, 47, 73, 0.35);
      }

      button:hover:not(:disabled) {
        background: rgba(51, 65, 85, 0.85);
        transform: translateY(-1px);
      }

      button.primary:hover:not(:disabled) {
        background: linear-gradient(135deg, #60a5fa, #2563eb);
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
      }

      .status-bar {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.95rem;
        color: rgba(226, 232, 240, 0.82);
      }

      .completion-message { color: #a7f3d0; font-weight: 600; }
      .error-message { color: #fca5a5; font-weight: 600; }

      #jspsych-target {
        display: none;
      }

      #jspsych-target.active {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        background: #000000;
        border: none;
        border-radius: 0;
        z-index: 9999;
        box-shadow: none;
      }

      .rsvp-trial {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(18px, 4vw, 28px);
        width: 100%;
        height: 100%;
      }

      .rsvp-instructions {
        font-size: clamp(1rem, 2.2vw, 1.25rem);
        text-align: center;
        color: var(--text-secondary);
      }

      .rsvp-stage {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(18px, 4vw, 32px);
      }

      .rsvp-reference-phase {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .rsvp-reference-frame {
        width: min(28vh, clamp(90px, 24vw, 320px));
        height: min(28vh, clamp(90px, 24vw, 320px));
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .rsvp-reference-frame img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
      }

      .afc-choice-phase {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(12px, 3vw, 24px);
        flex-wrap: wrap;
        max-width: 1000px;
      }

      .afc-choice {
        position: relative;
        background: rgba(15, 23, 42, 0.9);
        border-radius: clamp(12px, 2vw, 18px);
        border: 1px solid rgba(148, 163, 184, 0.28);
        padding: clamp(6px, 1vw, 12px);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 20px rgba(2, 6, 23, 0.45);
        transition: transform 120ms ease, box-shadow 120ms ease;
      }

      .afc-choice img {
        width: min(16vh, clamp(50px, 14vw, 160px));
        height: min(16vh, clamp(50px, 14vw, 160px));
        object-fit: cover;
        border-radius: clamp(8px, 1.5vw, 12px);
        pointer-events: none;
      }

      .afc-choice.selected {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
        background: rgba(37, 99, 235, 0.2);
      }

      .afc-choice.selected::after {
        content: "✓";
        position: absolute;
        top: -8px;
        right: -8px;
        background: var(--accent);
        color: white;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 14px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        pointer-events: none;
      }

      .afc-choice:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 16px 28px rgba(2, 6, 23, 0.55);
      }

    </style>
  </head>
  <body>
    <section class="card" id="intro-card">
      <h1>Dual Image Masking</h1>
      <p>
        On each trial, two images will flash briefly in rapid succession.
        Afterwards, you will see 10 images. Please click the two images you saw.
      </p>
      <div class="controls">
        <button class="primary" id="start-button" disabled>Preparing stimuli…</button>
        <button id="stop-button" disabled>Stop</button>
        <button id="download-csv" disabled>Download CSV</button>
        <button id="download-json" disabled>Download JSON</button>
      </div>
      <div class="status-bar">
        <span id="stimulus-status">Loading stimulus manifest…</span>
        <span id="progress-status">Trials prepared: 0</span>
        <span id="message-area"></span>
      </div>
    </section>

    <div id="jspsych-target"></div>

    <script src="https://unpkg.com/jspsych@8.0.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.0.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.0.0"></script>
    <!-- jsQuestPlus needed for adaptive logic -->
    <script src="https://unpkg.com/jsquest-plus@2.1.0/dist/jsQuestPlus.js"></script>
    <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>
    <script type="module" src="dual-image-masking.js"></script>
  </body>
</html>
