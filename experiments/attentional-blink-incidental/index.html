      rel="stylesheet"

    <script src="https://unpkg.com/@jspsych/plugin-preload@2.0.0"></script>

    <style>
      /* Add custom CSS here */
      #loading-message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 24px;
        z-index: 1000;
      }
      body {
        background-color: #808080; /* Gray background typical for psychophysics */
        color: #ffffff;
      }
      .jspsych-content {
        max-width: 1000px;
      }
      .stimulus-image {
        width: 100%;
        max-width: 400px;
        height: auto;
        aspect-ratio: 1 / 1;
        object-fit: cover;
      }
      .instruction-text {
        font-size: 24px;
        line-height: 1.5;
        margin-bottom: 20px;
      }
      .rsvp-container {
        position: relative;
        width: 100%;
        max-width: 400px;
        height: auto;
        aspect-ratio: 1 / 1;
        margin: 0 auto;
      }
      .rsvp-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
      }
      .rsvp-image.active {
        display: block;
      }
    </style>
  </head>
  <body>

      // Wrap entire logic in an IIFE so we can await mask generation
      (async function initExperiment() {
        
        // ENVIRONMENT TOGGLE
        // Set to "web" for online data collection, or "MEG" for offline lab collection
        const setup = "web"; 

        // Initialize jsPsych
        const jsPsych = initJsPsych({
          on_finish: function () {
            jsPsych.data.displayData();
          },
        });

        const subject_id = jsPsych.randomization.randomID(10);
        const filename = `${subject_id}.csv`;
        jsPsych.data.addProperties({ subject_id: subject_id });

        // 1. S2 Images (Highly memorable intact images)
        const s2_images = [
          "../../assets/highly_memorable_targets/baby_17s.jpg",

          "../../assets/highly_memorable_targets/pug_05s.jpg",
          "../../assets/highly_memorable_targets/rack1_07s.jpg",
          "../../assets/highly_memorable_targets/ramp_05s.jpg",
          "../../assets/highly_memorable_targets/screen2_01b.jpg",
          "../../assets/highly_memorable_targets/seesaw_12s.jpg",
          "../../assets/highly_memorable_targets/sequin_05s.jpg",
          "../../assets/highly_memorable_targets/shelf_07s.jpg",
          "../../assets/highly_memorable_targets/snowball_08s.jpg",
          "../../assets/highly_memorable_targets/sonogram_08s.jpg",
          "../../assets/highly_memorable_targets/spam_02s.jpg",
          "../../assets/highly_memorable_targets/splinter_11s.jpg",
          "../../assets/highly_memorable_targets/springboard_13s.jpg",
          "../../assets/highly_memorable_targets/spur_03s.jpg",
          "../../assets/highly_memorable_targets/stiletto_06s.jpg",
          "../../assets/highly_memorable_targets/stockings_12s.jpg",
          "../../assets/highly_memorable_targets/straw2_14s.jpg",
          "../../assets/highly_memorable_targets/string_cheese_04s.jpg",
          "../../assets/highly_memorable_targets/suspenders_12s.jpg",
          "../../assets/highly_memorable_targets/sweater_19s.jpg",
          "../../assets/highly_memorable_targets/swimsuit_06s.jpg",
          "../../assets/highly_memorable_targets/tack_03s.jpg",
          "../../assets/highly_memorable_targets/tamale_06s.jpg",
          "../../assets/highly_memorable_targets/tarantula_07s.jpg",
          "../../assets/highly_memorable_targets/test_tube_01b.jpg",
          "../../assets/highly_memorable_targets/toilet_paper_01b.jpg",
          "../../assets/highly_memorable_targets/toothpick_11s.jpg",
          "../../assets/highly_memorable_targets/torso_05s.jpg",
          "../../assets/highly_memorable_targets/tube_top_12s.jpg",
          "../../assets/highly_memorable_targets/turban_07s.jpg",
          "../../assets/highly_memorable_targets/turf_09s.jpg",
          "../../assets/highly_memorable_targets/videogame_01b.jpg",
          "../../assets/highly_memorable_targets/visor_08s.jpg",
          "../../assets/highly_memorable_targets/whistle_11s.jpg",
          "../../assets/highly_memorable_targets/wig_14s.jpg",
          "../../assets/highly_memorable_targets/wooden_leg_01b.jpg",
        ];

        // Helper: shuffle array in place
        function shuffleArray(array) {
          for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
          }
          return array;
        }

        const shuffled_s2_images = shuffleArray([...s2_images]);
        // 2. Global Target (S1)
        const global_target = shuffled_s2_images[0];
        const presented_images = shuffled_s2_images.slice(1, 49); // 48 images for 24 trials
        const unpresented_images = shuffled_s2_images.slice(49, 97); // 48 decoys

        // 3. Novel Images (Decoys for Phase 3)
        const novel_images = unpresented_images; // We use unpresented images as decoys

        // 4. Masks (Scrambled images)
        function generateShuffledMask(imageSrc) {
          return new Promise((resolve, reject) => {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => {
              const size = 300;
              const gridSize = 10;
              const tileSize = size / gridSize;

              const tileCoords = [];
              for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                  tileCoords.push({ x, y });
                }
              }

              shuffleArray(tileCoords);
              const maskedCanvas = document.createElement("canvas");
              maskedCanvas.width = size;
              maskedCanvas.height = size;
              const maskedCtx = maskedCanvas.getContext("2d");

              const sW = img.naturalWidth / gridSize;
              const sH = img.naturalHeight / gridSize;

              let i = 0;
              for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                  const src = tileCoords[i++];
                  maskedCtx.drawImage(
                    img,
                    src.x * sW,
                    src.y * sH,
                    sW,
                    sH,
                    x * tileSize,
                    y * tileSize,
                    tileSize,
                    tileSize,
                  );
                }
              }
              resolve(maskedCanvas.toDataURL());
            };
            img.onerror = () =>
              reject(new Error("Failed to load image for masking."));
            img.src = imageSrc;
          });
        }

        // Generate masks from unpresented images
        const masks = await Promise.all(
          unpresented_images.map((src) => generateShuffledMask(src)),
        );

        // Combine all images for preloading
        const all_images = [
          global_target,
          ...s2_images,
          ...novel_images,
          ...masks,
        ];

        // Preload trial
        const preload_trial = {
          type: jsPsychPreload,
          images: all_images,
        };

        // Timeline array
        const timeline = [preload_trial];

        // --- Phase 1: Target Introduction ---
        const phase1_instructions = {
          type: jsPsychHtmlButtonResponse,
          stimulus: `
        <div class="instruction-text">
          <p><strong>Phase 1: Memorize the Target</strong></p>
          <p>Please memorize the image below.</p>
          <img src="${global_target}" class="stimulus-image" />
          <p>In the next phase, you will see rapid streams of images.</p>
          <p>Press the <strong>SPACEBAR</strong> or tap <strong>Target!</strong> as quickly as possible whenever you see this exact image.</p>
          <p>Click Continue to begin the experiment.</p>
        </div>
      `,
          choices: ["Continue"],
          post_trial_gap: 1000,
        };

        timeline.push(phase1_instructions);

        // --- Phase 2: RSVP Streams ---
        const num_trials = 24;
        let available_s2 = shuffleArray([...presented_images]);
        const trial_variables = []; // Store variables to be used in phase 3

        // Pre-calculate all conditions to use in memory phase
        for (let i = 0; i < num_trials; i++) {
          const lag = Math.random() > 0.5 ? 2 : 8;
          const has_target = Math.random() < 0.2;
          const i1_pos = 4 + Math.floor(Math.random() * 3);
          const i2_pos = i1_pos + lag;

          let s1_pos = -1;
          if (has_target) {
            do {
              s1_pos = Math.floor(Math.random() * 20);
            } while (s1_pos === i1_pos || s1_pos === i2_pos);
          }

          trial_variables.push({
            image1: available_s2[i * 2],
            image2: available_s2[i * 2 + 1],
            lag: lag,
            condition: lag < 5 ? "short" : "long",
            s1_pos: s1_pos,
            i1_pos: i1_pos,
            i2_pos: i2_pos,
          });
        }

        const rsvp_continuous_trial = {
          type: jsPsychHtmlButtonResponse,
          stimulus: `
        <div class="rsvp-container">
            <div id="rsvp-fixation" style="font-size:48px; position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); display:none;">+</div>
            <img id="rsvp-image-display" class="rsvp-image" style="display:block;" src="" />
            <div id="photodiode-patch" style="position: absolute; bottom: 0; right: 0; width: 50px; height: 50px; background-color: black; display: none; z-index: 100;"></div>
        </div>
        <button class="jspsych-btn" id="custom-target-btn" style="margin-top: 20px;">Target!</button>
      `,
          choices: [],
          response_ends_trial: false,
          on_load: function () {
            const imgDisplay = document.getElementById("rsvp-image-display");
            const fixDisplay = document.getElementById("rsvp-fixation");
            const totalBlocks = num_trials;
            let currentBlockIndex = 0;
            let currentState = "NORMAL"; // NORMAL, SENTINEL, PAUSED, FIXATION

            let blockFrames = [];
            let frameIndex = 0;
            let s1FrameIndex = -1;

            let lastTime = performance.now();
            const frameDuration = 100;
            let animationFrameId;

            let responseDetected = false;
            let s1ShownTime = 0;

            // Keyboard fallback
            const keydownListener = function (e) {
              if (e.key === " " || e.code === "Space") {
                e.preventDefault();
                responseDetected = true;
              }
            };
            document.addEventListener("keydown", keydownListener);
            jsPsych.getCurrentTrial().keydownListener = keydownListener;

            // Button click fallback
            const btn = document.getElementById("custom-target-btn");
            if (btn) {
              btn.addEventListener("click", (e) => {
                e.preventDefault();
                responseDetected = true;
              });
            }

            let frameLog = []; // Store timing and ID for each frame

            function generateBlock(isSentinel, blockIdx) {
              const frames = [];
              const tv = trial_variables[blockIdx];
              let s1_pos = tv.s1_pos;
              const i1_pos = tv.i1_pos;
              const i2_pos = tv.i2_pos;

              if (isSentinel && s1_pos === -1) {
                // If it's a sentinel block, we must have a target.
                // If the original trial didn't have one, assign a random valid position
                do {
                  s1_pos = Math.floor(Math.random() * 20);
                } while (s1_pos === i1_pos || s1_pos === i2_pos);
              }

              for (let j = 0; j < 20; j++) {
                if (j === s1_pos) {
                  frames.push({ src: global_target, type: "S1" });
                } else if (j === i1_pos && !isSentinel) {
                  frames.push({ src: tv.image1, type: "S2_1" });
                } else if (j === i2_pos && !isSentinel) {
                  frames.push({ src: tv.image2, type: "S2_2" });
                } else {
                  frames.push({
                    src: masks[Math.floor(Math.random() * masks.length)],
                    type: "Mask",
                  });
                }
              }
              return { frames, s1_pos };
            }

            function startNextBlock(isSentinel) {
              responseDetected = false;
              s1ShownTime = 0;
              frameLog = []; // Reset log for the new block

              let currentTvIndex = isSentinel
                ? Math.floor(Math.random() * totalBlocks)
                : currentBlockIndex;

              const blockData = generateBlock(isSentinel, currentTvIndex);
              blockFrames = blockData.frames;
              s1FrameIndex = blockData.s1_pos;
              frameIndex = 0;

              currentState = isSentinel ? "SENTINEL" : "NORMAL";
              imgDisplay.style.display = "block";

              lastTime = performance.now();
              animationFrameId = requestAnimationFrame(updateStream);
            }

            function finishContinuousTrial() {
              if (animationFrameId) cancelAnimationFrame(animationFrameId);
              const listener = jsPsych.getCurrentTrial().keydownListener;
              if (listener) {
                document.removeEventListener("keydown", listener);
              }
              jsPsych.finishTrial({});
            }

            function updateStream(time) {
              if (time - lastTime >= frameDuration) {
                
                // Photodiode state generation
                let pd_is_on = false;
                const pdElement = document.getElementById("photodiode-patch");
                if (setup === "MEG" && pdElement) {
                  pdElement.style.display = "block";
                  pd_is_on = Math.random() > 0.5;
                  pdElement.style.backgroundColor = pd_is_on ? "white" : "black";
                } else if (pdElement) {
                  pdElement.style.display = "none";
                }

                if (frameIndex < blockFrames.length) {
                  const frameData = blockFrames[frameIndex];
                  imgDisplay.src = frameData.src;
                  frameLog.push({
                    time: time,
                    src: frameData.src,
                    type: frameData.type,
                    pd_state: pd_is_on
                  });

                  if (frameIndex === s1FrameIndex) {
                    s1ShownTime = time;
                    responseDetected = false; // Reset response window at S1 onset
                  }

                  frameIndex++;
                  lastTime = time;
                } else {
                  // End of 20 frames (2 seconds)
                  // If there was a target, wait another 1 second to see if there's a late response (3s total from S1)
                  const timeSinceS1 = time - s1ShownTime;
                  if (s1FrameIndex !== -1 && s1ShownTime > 0 && timeSinceS1 <= 3000) {
                    // keep waiting
                    const maskSrc =
                      masks[Math.floor(Math.random() * masks.length)];
                    imgDisplay.src = maskSrc;
                    frameLog.push({
                      time: time,
                      src: maskSrc,
                      type: "Mask_Padding",
                      pd_state: pd_is_on
                    });
                    lastTime = time;
                  } else {
                    // Either 3 seconds have passed since S1, OR there was no S1
                    // Log data before advancing block state
                    jsPsych.data.write({
                      phase: "rsvp",
                      image1: trial_variables[currentBlockIndex].image1,
                      image2: trial_variables[currentBlockIndex].image2,
                      lag: trial_variables[currentBlockIndex].lag,
                      condition: trial_variables[currentBlockIndex].condition,
                      s1_pos: trial_variables[currentBlockIndex].s1_pos,
                      i1_pos: trial_variables[currentBlockIndex].i1_pos,
                      i2_pos: trial_variables[currentBlockIndex].i2_pos,
                      sentinel_mode: currentState === "SENTINEL",
                      detected: responseDetected,
                      frame_log: JSON.stringify(frameLog), // Save the frame log
                    });

                    if (s1FrameIndex !== -1) {
                      // Trial had a target (or was sentinel)
                      if (responseDetected) {
                        // Correctly detected S1
                        currentState = "PAUSED";
                        imgDisplay.style.display = "none";
                        if (pdElement) pdElement.style.display = "none";
                        setTimeout(() => {
                          if (
                            currentState === "PAUSED" ||
                            currentState === "SENTINEL_PAUSED"
                          ) {
                            if (currentState === "PAUSED") {
                              currentBlockIndex++;
                            }
                            if (currentBlockIndex >= totalBlocks) {
                              finishContinuousTrial();
                            } else {
                              startNextBlock(false); // Start normal block
                            }
                          }
                        }, 1000);
                        return;
                      } else {
                        // Missed S1
                        startNextBlock(true); // Start sentinel block
                        return;
                      }
                    } else {
                      // Trial had NO target. Proceed seamlessly.
                      currentBlockIndex++;
                      if (currentBlockIndex >= totalBlocks) {
                        finishContinuousTrial();
                      } else {
                        startNextBlock(false); // Start normal block
                      }
                      return;
                    }
                  }
                }
              }

              animationFrameId = requestAnimationFrame(updateStream);
            }

            // Start the first block
            startNextBlock(false);
          },
        };

        timeline.push({
          type: jsPsychHtmlButtonResponse,
          stimulus:
            '<div class="instruction-text"><p>Phase 2 starting.</p><p>Press SPACEBAR or tap the Target button as quickly as possible when you see the target.</p><p>Click Continue to begin.</p></div>',
          choices: ["Continue"],
          post_trial_gap: 1000,
        });

        timeline.push(rsvp_continuous_trial);

        // --- Phase 3: Surprise 2AFC Memory Test ---

        timeline.push({
          type: jsPsychHtmlButtonResponse,
          stimulus: `
            <div class="instruction-text">
                <p><strong>Phase 3: Surprise Memory Test</strong></p>
                <p>You have finished the rapid streams.</p>
                <p>During those streams, you actually saw other intact images besides the target.</p>
                <p>In this final phase, you will see pairs of images.</p>
                <p>For each pair, click on the image that you <strong>remember seeing</strong> during the streams.</p>
                <p>Click Continue to begin.</p>
            </div>
        `,
          choices: ["Continue"],
          post_trial_gap: 1000,
        });

        const memory_trials = [];
        // We will test all S2 images used in the RSVP phase
        const used_s2 = presented_images;
        let available_decoys = shuffleArray([...novel_images]);

        for (let i = 0; i < num_trials; i++) {
          const tv = trial_variables[i];
          const lag = tv.lag;
          const condition = tv.condition;

          const img1 = tv.image1;
          const decoy1 = available_decoys[i * 2];

          const img2 = tv.image2;
          const decoy2 = available_decoys[i * 2 + 1];

          // Push memory test for Image 1
          const choices1 = [
            `<img src="${img1}" class="stimulus-image" style="width:100%; max-width:300px; height:auto; aspect-ratio:1/1; cursor:pointer;" />`,
            `<img src="${decoy1}" class="stimulus-image" style="width:100%; max-width:300px; height:auto; aspect-ratio:1/1; cursor:pointer;" />`,
          ];
          let correct_index1 = 0;
          if (Math.random() > 0.5) {
            choices1.reverse();
            correct_index1 = 1;
          }

          memory_trials.push({
            type: jsPsychHtmlButtonResponse,
            stimulus:
              '<p style="font-size:24px; margin-bottom: 20px;">Which image did you see?</p>',
            choices: choices1,
            data: {
              phase: "memory_test",
              s2_image: img1,
              decoy_image: decoy1,
              image_index: 1,
              original_lag: lag,
              original_condition: condition,
              correct_response: correct_index1,
            },
            on_finish: function (data) {
              data.correct = data.response === data.correct_response;
            },
          });

          // Push memory test for Image 2
          const choices2 = [
            `<img src="${img2}" class="stimulus-image" style="width:100%; max-width:300px; height:auto; aspect-ratio:1/1; cursor:pointer;" />`,
            `<img src="${decoy2}" class="stimulus-image" style="width:100%; max-width:300px; height:auto; aspect-ratio:1/1; cursor:pointer;" />`,
          ];
          let correct_index2 = 0;
          if (Math.random() > 0.5) {
            choices2.reverse();
            correct_index2 = 1;
          }

          memory_trials.push({
            type: jsPsychHtmlButtonResponse,
            stimulus:
              '<p style="font-size:24px; margin-bottom: 20px;">Which image did you see?</p>',
            choices: choices2,
            data: {
              phase: "memory_test",
              s2_image: img2,
              decoy_image: decoy2,
              image_index: 2,
              original_lag: lag,
              original_condition: condition,
              correct_response: correct_index2,
            },
            on_finish: function (data) {
              data.correct = data.response === data.correct_response;
            },
          });
        }

        const memory_procedure = {
          timeline: memory_trials,
          randomize_order: true,
        };

        timeline.push(memory_procedure);

        // --- End of Experiment ---
        timeline.push({
          type: jsPsychHtmlButtonResponse,
          stimulus: `
            <div class="instruction-text">
                <p>The experiment is now complete.</p>
                <p>Thank you for participating!</p>
                <p>Click Download Results/Finish to end.</p>
            </div>
        `,
          choices: ["Finish"],
          on_finish: function () {
            // Only trigger local download in MEG setup
            if (setup === "MEG") {
                jsPsych.data.get().localSave("csv", "results.csv");
            }
          },
        });

        const save_data = {
          type: jsPsychPipe,
          action: "save",
          experiment_id: "igmld2RYBkaK",
          filename: filename,
          data_string: () => jsPsych.data.get().csv(),
        };

        // Only push to DataPipe if we are connected to the web
        if (setup === "web") {
            timeline.push(save_data);
        }

        // Hide loading message and run the experiment
        document.getElementById("loading-message").style.display = "none";
        jsPsych.run(timeline);
      })(); // End of initExperiment
    </script>
  </body>
</html>
